<h2>Sản phẩm</h2>

<div class="toolbar">
  <input #kw type="search" placeholder="Tìm theo tên" (keyup.enter)="onSearch(kw.value)" />
  <button type="button" (click)="onSearch(kw.value)">Tìm</button>
  <a class="primary" routerLink="/products/new">+ Thêm sản phẩm</a>
</div>

@if (error()) {
  <p class="error">{{ error() }}</p>
}

<table>
  <thead>
    <tr>
      <th>Mã</th>
      <th>Tên</th>
      <th class="num">Giá</th>
      <th class="num">Tồn kho</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (p of products(); track p.id) {
      <tr>
        <td>{{ p.code }}</td>
        <td>{{ p.name }}</td>
        <td class="num">{{ p.price | number: '1.0-2' }}</td>
        <td class="num">{{ p.stock }}</td>
        <td class="actions">
          <a [routerLink]="['/products', p.id, 'edit']">Sửa</a>
          <button type="button" (click)="remove(p)">Xóa</button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="5">Chưa có sản phẩm</td>
      </tr>
    }
  </tbody>
</table>
